<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AlphaBucks</title>
<meta name="theme-color" content="#11131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AlphaBucks">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #11131a;
    --panel: #1b1e28;
    --panel-2: #262a37;
    --fg: #f4f5f8;
    --muted: #8b90a3;
    --ring-track: #262a37;
    --accent: #4ade80;
    --accent-ink: #062b14;
    --warn: #fbbf24;
    --warn-ink: #3a2700;
    --danger: #f87171;
    --ring-size: min(62vw, 34vh, 340px);
    --pad-top: calc(env(safe-area-inset-top) + 12px);
    --pad-bottom: calc(env(safe-area-inset-bottom) + 12px);
    --pad-left: calc(env(safe-area-inset-left) + 16px);
    --pad-right: calc(env(safe-area-inset-right) + 16px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
  }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  input {
    font: inherit;
    font-size: 16px; /* 16px+ stops iOS zooming in on focus */
    -webkit-user-select: text;
    user-select: text;
  }

  /* ---------- Game screen ---------- */
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
    gap: 12px;
  }
  #ringWrap {
    flex: none;
    align-self: center;
    position: relative;
    width: var(--ring-size);
    height: var(--ring-size);
    margin-top: 8px;
  }
  #ring { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  #ring .track { stroke: var(--ring-track); }
  #ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke 0.3s; }
  #ring.low .bar { stroke: var(--danger); }
  #ring.done .bar { stroke: var(--warn); }
  #seconds {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: calc(var(--ring-size) * 0.4);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  #topicArea {
    flex: 1 1 auto;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
    border-radius: 24px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #topic {
    font-size: clamp(32px, 10vw, 60px);
    font-weight: 800;
    line-height: 1.1;
    overflow-wrap: anywhere;
    max-width: 100%;
  }
  #topic.idle { color: var(--muted); }
  #sub {
    margin-top: 10px;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 600;
    color: var(--muted);
    min-height: 1.3em;
  }
  #sub.big { color: var(--fg); font-size: clamp(24px, 7vw, 36px); }

  #bar {
    flex: none;
    display: flex;
    gap: 12px;
    height: clamp(84px, 13vh, 120px);
  }
  #bar button {
    flex: 1;
    border-radius: 24px;
    font-size: clamp(24px, 7vw, 34px);
    font-weight: 800;
    transition: transform 0.08s, filter 0.08s, opacity 0.2s;
  }
  #bar button:active { transform: scale(0.97); filter: brightness(0.9); }
  #bar button:disabled { opacity: 0.45; }
  #bar button[hidden] { display: none; }
  .btn-go { background: var(--accent); color: var(--accent-ink); }
  .btn-skip { background: var(--warn); color: var(--warn-ink); }
  .btn-neutral { background: var(--panel-2); color: var(--fg); }

  #letter {
    flex: none;
    text-align: center;
    font-size: clamp(88px, 19vh, 200px);
    font-weight: 900;
    line-height: 1;
    padding-bottom: 4px;
  }

  /* Hold-to-open ring */
  #holdRing {
    position: fixed;
    width: 120px;
    height: 120px;
    margin: -60px 0 0 -60px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 5;
  }
  #holdRing.on { opacity: 1; }
  #holdRing svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #holdRing .track { stroke: rgba(255,255,255,0.15); }
  #holdRing .bar { stroke: var(--fg); stroke-linecap: round; }

  /* Time's-up flash */
  #flash {
    position: fixed;
    inset: 0;
    background: var(--danger);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }
  #flash.go { animation: flash 1.2s ease-out; }
  @keyframes flash {
    0%, 30%, 60% { opacity: 0.85; }
    15%, 45%, 100% { opacity: 0; }
  }

  /* ---------- Settings ---------- */
  #settings {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 10;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    padding: 0 var(--pad-right) calc(var(--pad-bottom) + 24px) var(--pad-left);
  }
  #settings[hidden] { display: none; }
  .s-head {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--pad-top) 0 12px;
    background: var(--bg);
  }
  .s-head h1 { margin: 0; font-size: 28px; }
  .s-sec {
    background: var(--panel);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .s-sec h2 {
    margin: 0 0 12px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .s-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 18px;
    min-height: 44px;
  }
  .s-note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .pill {
    background: var(--panel-2);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 17px;
    font-weight: 600;
    min-height: 44px;
  }
  .pill.primary { background: var(--accent); color: var(--accent-ink); }
  .pill.danger { color: var(--danger); }

  #topicList { list-style: none; margin: 0; padding: 0; }
  #topicList li {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  #topicList input, #newTopic {
    flex: 1;
    min-width: 0;
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 11px 12px;
    outline: none;
  }
  #topicList input:focus, #newTopic:focus { border-color: var(--accent); }
  .icon-btn {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--panel-2);
    font-size: 18px;
    display: grid;
    place-items: center;
  }
  .icon-btn:disabled { opacity: 0.3; }
  .icon-btn.del { color: var(--danger); }
  .add-row { display: flex; gap: 8px; margin-top: 4px; }

  .seg {
    display: flex;
    background: var(--panel-2);
    border-radius: 12px;
    padding: 4px;
  }
  .seg button {
    flex: 1;
    padding: 10px;
    border-radius: 9px;
    background: transparent;
    font-size: 17px;
    font-weight: 600;
    color: var(--muted);
  }
  .seg button.on { background: var(--fg); color: var(--bg); }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 12px;
  }
  .grid button {
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--panel-2);
    font-size: 19px;
    font-weight: 700;
  }
  .grid button.sel { background: var(--accent); color: var(--accent-ink); }
  .grid button.off { background: transparent; color: var(--muted); text-decoration: line-through; outline: 1px dashed var(--panel-2); }

  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper output { min-width: 64px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .switch { position: relative; width: 52px; height: 32px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; z-index: 1; }
  .switch span {
    position: absolute; inset: 0; border-radius: 16px; background: var(--panel-2); transition: background 0.2s;
  }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; transition: transform 0.2s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }

  /* ---------- Paused dialog ---------- */
  #dialog {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,0.75);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  #dialog[hidden] { display: none; }
  .d-box {
    width: min(100%, 380px);
    background: var(--panel);
    border-radius: 24px;
    padding: 24px;
    text-align: center;
  }
  .d-box h2 { margin: 0 0 6px; font-size: 26px; }
  .d-box p { margin: 0 0 20px; color: var(--muted); font-size: 17px; }
  .d-box button { display: block; width: 100%; height: 64px; border-radius: 18px; font-size: 22px; font-weight: 800; margin-top: 10px; }
</style>
</head>
<body>

<main id="app">
  <div id="ringWrap">
    <svg id="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="45" fill="none" stroke-width="8"/>
      <circle class="bar" id="ringBar" cx="50" cy="50" r="45" fill="none" stroke-width="8"/>
    </svg>
    <div id="seconds" aria-live="off">30</div>
  </div>

  <div id="topicArea">
    <div id="topic" class="idle">Ready?</div>
    <div id="sub"></div>
  </div>

  <div id="bar">
    <button id="startBtn" class="btn-go">Start</button>
    <button id="skipBtn" class="btn-skip" hidden>Skip</button>
    <button id="correctBtn" class="btn-go" hidden>Correct</button>
    <button id="newBtn" class="btn-neutral" hidden>New round</button>
  </div>

  <div id="letter">A</div>
</main>

<div id="holdRing" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="7"/>
    <circle class="bar" id="holdBar" cx="50" cy="50" r="44" fill="none" stroke-width="7"/>
  </svg>
</div>
<div id="flash"></div>

<section id="settings" hidden>
  <div class="s-head">
    <h1>Settings</h1>
    <button id="closeSettings" class="pill primary">Close</button>
  </div>

  <div class="s-sec">
    <h2><span>Topics</span><span id="topicCount"></span></h2>
    <ol id="topicList"></ol>
    <div class="add-row">
      <input id="newTopic" type="text" placeholder="Add a topic" enterkeyhint="done" autocomplete="off" autocapitalize="sentences">
      <button id="addTopic" class="pill primary">Add</button>
    </div>
    <div class="s-row" style="margin-top:12px">
      <span></span>
      <button id="resetTopics" class="pill danger">Reset topics</button>
    </div>
  </div>

  <div class="s-sec">
    <div class="s-row">
      <span>Shuffle topic order each round</span>
      <label class="switch"><input type="checkbox" id="shuffleToggle"><span></span></label>
    </div>
  </div>

  <div class="s-sec">
    <h2>Letter</h2>
    <div class="seg" id="letterMode">
      <button data-mode="random">Random</button>
      <button data-mode="manual">Pick one</button>
    </div>
    <div id="manualBlock">
      <div class="grid" id="manualGrid"></div>
      <p class="s-note">This letter stays until you switch back to Random.</p>
    </div>
    <div id="randomBlock">
      <div class="grid" id="excludeGrid"></div>
      <p class="s-note">Tap a letter to include or exclude it. Crossed-out letters are never dealt.</p>
    </div>
  </div>

  <div class="s-sec">
    <div class="s-row">
      <span>Timer length</span>
      <div class="stepper">
        <button class="icon-btn" id="timeDown" aria-label="Less time">−</button>
        <output id="timeVal">30s</output>
        <button class="icon-btn" id="timeUp" aria-label="More time">+</button>
      </div>
    </div>
  </div>

  <div class="s-sec">
    <div class="s-row">
      <span>Sound</span>
      <label class="switch"><input type="checkbox" id="soundToggle"><span></span></label>
    </div>
  </div>
</section>

<div id="dialog" hidden>
  <div class="d-box">
    <h2>Round paused</h2>
    <p id="dialogInfo"></p>
    <button id="resumeBtn" class="btn-go">Resume</button>
    <button id="restartBtn" class="btn-neutral">New round</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Settings & storage ----------
  const DEFAULT_TOPICS = [
    'Animal', 'Food', 'Body part', 'Mythical creature', 'Country',
    'Name', 'Job', 'Sport', 'Something in a kitchen', 'Brand'
  ];
  const DEFAULTS = {
    topics: DEFAULT_TOPICS.slice(),
    letterMode: 'random',
    manualLetter: 'E',
    excludedLetters: ['Q', 'U', 'V', 'X', 'Y', 'Z'],
    timerSeconds: 30,
    shuffleTopics: true,
    sound: true
  };
  const KEY = 'alphabucks.settings.v1';
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const HOLD_MS = 3000;
  const END_LOCK_MS = 900; // stops a frantic tap jumping straight into the next round

  function loadSettings() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
    const s = Object.assign({}, DEFAULTS, saved);
    if (!Array.isArray(s.topics)) s.topics = DEFAULT_TOPICS.slice();
    s.topics = s.topics.filter(t => typeof t === 'string');
    if (!Array.isArray(s.excludedLetters)) s.excludedLetters = DEFAULTS.excludedLetters.slice();
    if (!LETTERS.includes(s.manualLetter)) s.manualLetter = 'E';
    if (s.letterMode !== 'manual') s.letterMode = 'random';
    s.timerSeconds = clamp(parseInt(s.timerSeconds, 10) || 30, 5, 600);
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

  let S = loadSettings();

  // ---------- Round state (not saved) ----------
  const G = {
    state: 'ready',    // ready | running | paused | won | timeup
    letter: 'A',
    queue: [],
    endTime: 0,        // Date.now() at which the round ends (while running)
    remaining: 0,      // ms left (while ready/paused/ended)
    total: 0,          // ms the round started with
    endedAt: 0
  };

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const el = {
    ring: $('ring'), ringBar: $('ringBar'), seconds: $('seconds'),
    topicArea: $('topicArea'), topic: $('topic'), sub: $('sub'),
    start: $('startBtn'), skip: $('skipBtn'), correct: $('correctBtn'), newRound: $('newBtn'),
    letter: $('letter'), holdRing: $('holdRing'), holdBar: $('holdBar'), flash: $('flash'),
    settings: $('settings'), dialog: $('dialog'), dialogInfo: $('dialogInfo')
  };
  const RING_C = 2 * Math.PI * 45;
  const HOLD_C = 2 * Math.PI * 44;
  el.ringBar.style.strokeDasharray = RING_C;
  el.holdBar.style.strokeDasharray = HOLD_C;

  // ---------- Helpers ----------
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function cleanTopics() {
    return S.topics.map(t => t.trim()).filter(Boolean);
  }
  function letterPool() {
    const pool = LETTERS.filter(l => !S.excludedLetters.includes(l));
    return pool.length ? pool : LETTERS;
  }
  function letterIsValid(l) {
    return S.letterMode === 'manual' ? l === S.manualLetter : letterPool().includes(l);
  }
  function pickLetter() {
    if (S.letterMode === 'manual') return S.manualLetter;
    const pool = letterPool();
    const options = pool.length > 1 ? pool.filter(l => l !== G.letter) : pool;
    return options[Math.floor(Math.random() * options.length)];
  }
  function buildQueue() {
    const t = cleanTopics();
    return S.shuffleTopics ? shuffle(t) : t;
  }
  function msLeft() {
    return G.state === 'running' ? Math.max(0, G.endTime - Date.now()) : G.remaining;
  }

  // ---------- Game flow ----------
  function deal() {
    G.letter = pickLetter();
    G.queue = buildQueue();
    G.total = G.remaining = S.timerSeconds * 1000;
    G.state = 'ready';
    render();
  }

  function start() {
    if (G.state !== 'ready' || !G.queue.length) return;
    unlockAudio();
    G.total = G.remaining = S.timerSeconds * 1000;
    G.endTime = Date.now() + G.remaining;
    G.state = 'running';
    keepAwake(true);
    render();
    loop();
  }

  function correct() {
    if (G.state !== 'running') return;
    if (tickCheck()) return;
    G.queue.shift();
    if (!G.queue.length) {
      G.remaining = Math.max(0, G.endTime - Date.now());
      G.state = 'won';
      endRound();
    }
    render();
  }

  function skip() {
    if (G.state !== 'running') return;
    if (tickCheck()) return;
    if (G.queue.length > 1) G.queue.push(G.queue.shift());
    render();
  }

  function timeUp() {
    G.remaining = 0;
    G.state = 'timeup';
    endRound();
    playAlarm();
    el.flash.classList.remove('go');
    void el.flash.offsetWidth; // restart the animation
    el.flash.classList.add('go');
    render();
  }

  function endRound() {
    G.endedAt = Date.now();
    keepAwake(false);
    el.newRound.disabled = true;
    setTimeout(() => { el.newRound.disabled = false; }, END_LOCK_MS);
  }

  function pause(remainingMs) {
    if (G.state !== 'running') return;
    G.remaining = Math.max(0, remainingMs);
    G.state = 'paused';
    keepAwake(false);
    render();
  }

  function resume() {
    if (G.state !== 'paused') return;
    G.endTime = Date.now() + G.remaining;
    G.state = 'running';
    keepAwake(true);
    render();
    loop();
  }

  // Returns true if the round just ended because time ran out.
  function tickCheck() {
    if (G.state === 'running' && Date.now() >= G.endTime) { timeUp(); return true; }
    return false;
  }

  let rafId = 0;
  function loop() {
    cancelAnimationFrame(rafId);
    const step = () => {
      if (G.state !== 'running') return;
      if (tickCheck()) return;
      drawTimer();
      rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
  }

  // ---------- Rendering ----------
  function drawTimer() {
    const left = msLeft();
    const frac = G.total ? left / G.total : 1;
    el.ringBar.style.strokeDashoffset = RING_C * (1 - clamp(frac, 0, 1));
    const secs = Math.ceil(left / 1000);
    if (el.seconds.textContent !== String(secs)) el.seconds.textContent = secs;
    el.ring.classList.toggle('low', G.state === 'running' && left <= 5000 || G.state === 'timeup');
    el.ring.classList.toggle('done', G.state === 'won');
  }

  function render() {
    const s = G.state;
    drawTimer();
    el.letter.textContent = G.letter;

    const topics = G.queue.length;
    el.topic.classList.toggle('idle', s === 'ready');
    el.sub.classList.remove('big');
    if (s === 'ready') {
      el.topic.textContent = topics ? 'Ready?' : 'No topics';
      el.sub.textContent = topics ? '' : 'Hold here to add some';
    } else if (s === 'running' || s === 'paused') {
      el.topic.textContent = G.queue[0];
      el.sub.textContent = topics === 1 ? 'Last one!' : topics + ' left';
    } else if (s === 'won') {
      el.topic.textContent = 'All done!';
      el.sub.textContent = Math.ceil(G.remaining / 1000) + 's left';
      el.sub.classList.add('big');
    } else if (s === 'timeup') {
      el.topic.textContent = "Time's up";
      el.sub.textContent = topics + ' left';
      el.sub.classList.add('big');
    }

    el.start.hidden = s !== 'ready';
    el.start.disabled = !topics;
    el.skip.hidden = el.correct.hidden = !(s === 'running' || s === 'paused');
    el.newRound.hidden = !(s === 'won' || s === 'timeup');
  }

  el.start.addEventListener('click', start);
  el.correct.addEventListener('click', correct);
  el.skip.addEventListener('click', skip);
  el.newRound.addEventListener('click', () => { if (!el.newRound.disabled) deal(); });

  // ---------- Sound (Web Audio; iOS needs a tap first) ----------
  let actx = null;
  function unlockAudio() {
    if (!S.sound) return;
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume();
      // Play a silent buffer inside the tap so iOS unlocks output.
      const buf = actx.createBuffer(1, 1, 22050);
      const src = actx.createBufferSource();
      src.buffer = buf;
      src.connect(actx.destination);
      src.start(0);
    } catch (e) {}
  }
  function tone(freq, at, dur, vol) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
    g.gain.setValueAtTime(vol, at + dur - 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g).connect(actx.destination);
    o.start(at);
    o.stop(at + dur + 0.02);
  }
  function playAlarm() {
    if (!S.sound || !actx) return;
    try {
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + 0.02;
      for (let i = 0; i < 3; i++) tone(880, t + i * 0.22, 0.16, 0.22);
      tone(587, t + 0.7, 0.6, 0.25);
    } catch (e) {}
  }

  // ---------- Keep the screen awake ----------
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on) {
        if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
          // The round may have ended while we waited for the lock.
          if (G.state !== 'running') keepAwake(false);
        }
      } else if (wakeLock) {
        const w = wakeLock; wakeLock = null;
        await w.release();
      }
    } catch (e) { wakeLock = null; }
  }

  // Locking the phone or switching apps: the end time is wall-clock based,
  // so on return we just check it again.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (G.state === 'running') {
      if (!tickCheck()) { keepAwake(true); loop(); }
    }
  });

  // ---------- Hold topic area for 3s to open settings ----------
  const hold = { id: null, start: 0, x: 0, y: 0, raf: 0, roundLeft: null };

  function holdCancel() {
    if (hold.id === null) return;
    hold.id = null;
    cancelAnimationFrame(hold.raf);
    el.holdRing.classList.remove('on');
  }
  el.topicArea.addEventListener('pointerdown', e => {
    if (hold.id !== null || !el.settings.hidden || !el.dialog.hidden) return;
    hold.id = e.pointerId;
    hold.start = Date.now();
    hold.x = e.clientX; hold.y = e.clientY;
    // Remember the clock now, so the 3s hold itself doesn't eat into the round.
    hold.roundLeft = G.state === 'running' ? G.endTime - hold.start : null;
    try { el.topicArea.setPointerCapture(e.pointerId); } catch (err) {}
    el.holdRing.style.left = e.clientX + 'px';
    el.holdRing.style.top = e.clientY + 'px';
    el.holdBar.style.strokeDashoffset = HOLD_C;
    el.holdRing.classList.add('on');
    const step = () => {
      if (hold.id === null) return;
      const p = (Date.now() - hold.start) / HOLD_MS;
      el.holdBar.style.strokeDashoffset = HOLD_C * (1 - clamp(p, 0, 1));
      if (p >= 1) {
        const left = hold.roundLeft;
        holdCancel();
        openSettings(left);
        return;
      }
      hold.raf = requestAnimationFrame(step);
    };
    hold.raf = requestAnimationFrame(step);
  });
  el.topicArea.addEventListener('pointermove', e => {
    if (e.pointerId !== hold.id) return;
    if (Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 40) holdCancel();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t =>
    el.topicArea.addEventListener(t, e => { if (e.pointerId === hold.id) holdCancel(); })
  );
  // Stop iOS's loupe, callout and text selection during the long press.
  el.topicArea.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  el.topicArea.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  // ---------- Settings panel ----------
  const topicList = $('topicList');
  const newTopic = $('newTopic');

  function openSettings(roundLeft) {
    if (G.state === 'running') pause(roundLeft != null ? roundLeft : G.endTime - Date.now());
    renderSettings();
    el.settings.hidden = false;
    el.settings.scrollTop = 0;
  }

  function closeSettings() {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    S.topics = S.topics.map(t => t.trim()).filter(Boolean);
    save();
    el.settings.hidden = true;
    if (G.state === 'paused') {
      const n = G.queue.length;
      el.dialogInfo.textContent = Math.ceil(G.remaining / 1000) + 's and ' + n + (n === 1 ? ' topic' : ' topics') + ' left';
      el.dialog.hidden = false;
    } else if (G.state === 'ready') {
      // Pick up any changes to topics, letters or timer length.
      if (!letterIsValid(G.letter)) G.letter = pickLetter();
      G.queue = buildQueue();
      G.total = G.remaining = S.timerSeconds * 1000;
      render();
    } else {
      render();
    }
  }

  function renderTopics() {
    topicList.innerHTML = '';
    S.topics.forEach((t, i) => {
      const li = document.createElement('li');
      const input = document.createElement('input');
      input.type = 'text';
      input.value = t;
      input.autocomplete = 'off';
      input.setAttribute('enterkeyhint', 'done');
      input.addEventListener('input', () => { S.topics[i] = input.value; save(); updateCount(); });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
      const up = iconBtn('↑', 'Move up', i === 0, () => move(i, -1));
      const down = iconBtn('↓', 'Move down', i === S.topics.length - 1, () => move(i, 1));
      const del = iconBtn('✕', 'Delete', false, () => { S.topics.splice(i, 1); save(); renderTopics(); });
      del.classList.add('del');
      li.append(input, up, down, del);
      topicList.appendChild(li);
    });
    updateCount();
  }
  function iconBtn(text, label, disabled, fn) {
    const b = document.createElement('button');
    b.className = 'icon-btn';
    b.textContent = text;
    b.setAttribute('aria-label', label);
    b.disabled = disabled;
    b.addEventListener('click', fn);
    return b;
  }
  function move(i, d) {
    const j = i + d;
    if (j < 0 || j >= S.topics.length) return;
    [S.topics[i], S.topics[j]] = [S.topics[j], S.topics[i]];
    save();
    renderTopics();
  }
  function updateCount() {
    const n = cleanTopics().length;
    $('topicCount').textContent = n + (n === 1 ? ' topic' : ' topics');
  }
  function addTopic() {
    const v = newTopic.value.trim();
    if (!v) return;
    S.topics.push(v);
    newTopic.value = '';
    save();
    renderTopics();
    newTopic.focus();
  }
  $('addTopic').addEventListener('click', addTopic);
  newTopic.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTopic(); } });
  $('resetTopics').addEventListener('click', () => {
    if (!confirm('Restore the 10 default topics? Your current list will be replaced.')) return;
    S.topics = DEFAULT_TOPICS.slice();
    save();
    renderTopics();
  });

  const shuffleToggle = $('shuffleToggle');
  shuffleToggle.addEventListener('change', () => { S.shuffleTopics = shuffleToggle.checked; save(); });
  const soundToggle = $('soundToggle');
  soundToggle.addEventListener('change', () => { S.sound = soundToggle.checked; save(); });

  $('letterMode').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (!b) return;
    S.letterMode = b.dataset.mode;
    save();
    renderLetters();
  });

  function renderLetters() {
    document.querySelectorAll('#letterMode button').forEach(b =>
      b.classList.toggle('on', b.dataset.mode === S.letterMode));
    $('manualBlock').hidden = S.letterMode !== 'manual';
    $('randomBlock').hidden = S.letterMode !== 'random';

    const mg = $('manualGrid'), xg = $('excludeGrid');
    mg.innerHTML = ''; xg.innerHTML = '';
    LETTERS.forEach(l => {
      const m = document.createElement('button');
      m.textContent = l;
      m.classList.toggle('sel', l === S.manualLetter);
      m.addEventListener('click', () => { S.manualLetter = l; save(); renderLetters(); });
      mg.appendChild(m);

      const x = document.createElement('button');
      x.textContent = l;
      const off = S.excludedLetters.includes(l);
      x.classList.toggle('off', off);
      x.setAttribute('aria-pressed', String(!off));
      x.addEventListener('click', () => {
        if (S.excludedLetters.includes(l)) {
          S.excludedLetters = S.excludedLetters.filter(v => v !== l);
        } else if (S.excludedLetters.length < LETTERS.length - 1) {
          S.excludedLetters = S.excludedLetters.concat(l).sort();
        } else {
          return; // keep at least one letter in play
        }
        save();
        renderLetters();
      });
      xg.appendChild(x);
    });
  }

  function renderTime() { $('timeVal').textContent = S.timerSeconds + 's'; }
  function stepTime(d) {
    S.timerSeconds = clamp(S.timerSeconds + d, 5, 600);
    save();
    renderTime();
  }
  $('timeDown').addEventListener('click', () => stepTime(-5));
  $('timeUp').addEventListener('click', () => stepTime(5));

  function renderSettings() {
    renderTopics();
    renderLetters();
    renderTime();
    shuffleToggle.checked = S.shuffleTopics;
    soundToggle.checked = S.sound;
  }
  $('closeSettings').addEventListener('click', closeSettings);

  // ---------- Paused dialog ----------
  $('resumeBtn').addEventListener('click', () => {
    el.dialog.hidden = true;
    unlockAudio();
    resume();
  });
  $('restartBtn').addEventListener('click', () => {
    el.dialog.hidden = true;
    deal();
  });

  // ---------- Boot ----------
  deal();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
