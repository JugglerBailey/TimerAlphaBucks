<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AlphaBucks</title>
<meta name="theme-color" content="#151412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AlphaBucks">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preload" href="fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-mono-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Anton";
    src: url("fonts/anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "JB Mono";
    src: url("fonts/jetbrains-mono-800.woff2") format("woff2");
    font-weight: 800;
    font-display: block;
  }
  :root {
    --paper: #f1ebdf;
    --card: #fffaf0;
    --ink: #151412;
    --red: #ff3d1f;
    --yellow: #ffd23f;
    --muted: #8a8378;
    --spent: rgba(21, 20, 18, 0.13);
    --display: "Anton", "Avenir Next Condensed", "Arial Narrow", Impact, sans-serif;
    --mono: "JB Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --body: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --dial: min(66vw, 35vh, 360px);
    --shadow: 5px 5px 0 var(--ink);
    --pad-top: calc(env(safe-area-inset-top) + 14px);
    --pad-bottom: calc(env(safe-area-inset-bottom) + 14px);
    --pad-left: calc(env(safe-area-inset-left) + 16px);
    --pad-right: calc(env(safe-area-inset-right) + 16px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: var(--body);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    transition: background-color 0.25s;
  }
  /* Black strip behind the iPhone status bar so its white text stays readable. */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top);
    background: var(--ink);
    z-index: 30;
  }
  body.timeup { background: var(--red); }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  input {
    font: inherit;
    font-size: 17px; /* 16px+ stops iOS zooming in on focus */
    -webkit-user-select: text;
    user-select: text;
  }

  /* ---------- Game screen ---------- */
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
    gap: 12px;
  }

  #dialWrap {
    flex: none;
    align-self: center;
    position: relative;
    width: var(--dial);
    height: var(--dial);
    margin-top: 6px;
  }
  #dial { width: 100%; height: 100%; display: block; overflow: visible; }
  #dial line { stroke: var(--spent); stroke-width: 3.2; stroke-linecap: butt; }
  #dial line.major { stroke-width: 4.2; }
  #dial line.on { stroke: var(--ink); }
  #dialWrap.low #dial line.on { stroke: var(--red); }
  #readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #time { white-space: nowrap; letter-spacing: -0.04em; }
  #secs { font-size: calc(var(--dial) * 0.27); }
  #cents { font-size: calc(var(--dial) * 0.15); }
  #unit {
    margin-top: calc(var(--dial) * 0.035);
    font-size: calc(var(--dial) * 0.05);
    letter-spacing: 0.25em;
    color: var(--muted);
  }
  #dialWrap.low #time { color: var(--red); }
  #dialWrap.low.tick #time { animation: thump 0.18s ease-out; }
  @keyframes thump { 0% { transform: scale(1.08); } 100% { transform: scale(1); } }
  body.timeup #time, body.timeup #unit { color: var(--ink); }

  #topicArea {
    flex: 1 1 auto;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #label {
    font-family: var(--mono);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    min-height: 1.2em;
    margin-bottom: 8px;
  }
  body.timeup #label { color: var(--ink); }
  #topic {
    font-family: var(--display);
    font-size: clamp(40px, 13vw, 76px);
    line-height: 1.02;
    text-transform: uppercase;
    overflow-wrap: anywhere;
    max-width: 100%;
  }
  #topic.idle { color: var(--muted); }
  #topic.pop { animation: pop 0.16s ease-out; }
  @keyframes pop { 0% { transform: translateY(6px); opacity: 0.2; } 100% { transform: none; opacity: 1; } }
  #sub {
    margin-top: 8px;
    font-family: var(--mono);
    font-weight: 800;
    font-size: clamp(20px, 6vw, 30px);
    min-height: 1.2em;
    font-variant-numeric: tabular-nums;
  }

  #bar {
    flex: none;
    display: flex;
    gap: 14px;
    height: clamp(80px, 12.5vh, 116px);
    padding: 0 5px 5px 0; /* room for the hard shadow */
  }
  .btn {
    flex: 1;
    border: 3px solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--shadow);
    font-family: var(--display);
    font-size: clamp(28px, 8.5vw, 40px);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    transition: transform 0.06s, box-shadow 0.06s, opacity 0.2s;
  }
  .btn:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled { opacity: 0.4; }
  .btn[hidden] { display: none; }
  .btn-start { background: var(--red); color: var(--card); }
  .btn-correct { background: var(--yellow); color: var(--ink); }
  .btn-skip { background: var(--card); color: var(--ink); flex: 0.75; }
  .btn-ink { background: var(--ink); color: var(--card); }

  #letterRow {
    flex: none;
    display: flex;
    justify-content: center;
    padding: 6px 0 8px;
  }
  #letter {
    --size: clamp(88px, 15.5vh, 170px);
    width: var(--size);
    height: var(--size);
    display: grid;
    place-items: center;
    background: var(--card);
    border: 4px solid var(--ink);
    border-radius: 8px;
    box-shadow: 8px 8px 0 var(--ink);
    font-family: var(--display);
    font-size: calc(var(--size) * 0.78);
    line-height: 1;
    padding-top: calc(var(--size) * 0.04);
    transform: rotate(var(--tilt, -4deg));
  }
  #letter.deal { animation: deal 0.35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes deal { 0% { transform: rotate(18deg) scale(0.6); opacity: 0; } 100% { transform: rotate(var(--tilt, -4deg)) scale(1); opacity: 1; } }

  /* Hold-to-open ring */
  #holdRing {
    position: fixed;
    width: 124px;
    height: 124px;
    margin: -62px 0 0 -62px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 5;
  }
  #holdRing.on { opacity: 1; }
  #holdRing svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #holdRing .track { stroke: var(--card); }
  #holdRing .bar { stroke: var(--ink); }

  /* Time's-up flash */
  #flash {
    position: fixed;
    inset: 0;
    background: var(--ink);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }
  #flash.go { animation: flash 0.9s steps(1, end); }
  @keyframes flash {
    0% { opacity: 1; } 15% { opacity: 0; } 30% { opacity: 1; } 45% { opacity: 0; } 60% { opacity: 1; } 75%, 100% { opacity: 0; }
  }

  /* ---------- Settings ---------- */
  #settings {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 10;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    padding: 0 var(--pad-right) calc(var(--pad-bottom) + 24px) var(--pad-left);
  }
  #settings[hidden] { display: none; }
  .s-head {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--pad-top) 0 14px;
    background: var(--paper);
    border-bottom: 3px solid var(--ink);
    margin-bottom: 18px;
  }
  .s-head h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 40px;
    text-transform: uppercase;
    line-height: 1;
  }
  .s-sec {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 14px;
    margin: 0 5px 20px 0;
  }
  .s-sec h2 {
    margin: 0 0 12px;
    font-family: var(--mono);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  .s-sec h2 span + span { color: var(--muted); }
  .s-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 18px;
    font-weight: 600;
    min-height: 44px;
  }
  .s-note { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .chip {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 6px;
    padding: 8px 16px;
    font-family: var(--display);
    font-size: 20px;
    text-transform: uppercase;
    min-height: 46px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .chip:active { transform: translate(3px, 3px); box-shadow: none; }
  .chip.ink { background: var(--ink); color: var(--card); }
  .chip.yellow { background: var(--yellow); }
  .chip.danger { color: var(--red); }

  #topicList { list-style: none; margin: 0; padding: 0; counter-reset: t; }
  #topicList li {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
    counter-increment: t;
  }
  #topicList li::before {
    content: counter(t, decimal-leading-zero);
    font-family: var(--mono);
    font-weight: 800;
    font-size: 13px;
    color: var(--muted);
    width: 22px;
    flex: none;
  }
  #topicList input, #newTopic {
    flex: 1;
    min-width: 0;
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 10px;
    outline: none;
    font-weight: 600;
  }
  #topicList input:focus, #newTopic:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--ink); }
  .icon-btn {
    flex: none;
    width: 42px;
    height: 44px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--card);
    font-family: var(--mono);
    font-weight: 800;
    font-size: 18px;
    display: grid;
    place-items: center;
  }
  .icon-btn:active { background: var(--ink); color: var(--card); }
  .icon-btn:disabled { opacity: 0.25; }
  .icon-btn.del { color: var(--red); }
  .add-row { display: flex; gap: 8px; margin-top: 6px; padding-left: 28px; }

  .seg {
    display: flex;
    border: 3px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
  }
  .seg button {
    flex: 1;
    padding: 10px;
    background: var(--card);
    font-family: var(--display);
    font-size: 20px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seg button + button { border-left: 3px solid var(--ink); }
  .seg button.on { background: var(--ink); color: var(--card); }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 12px;
  }
  .grid button {
    aspect-ratio: 1;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--card);
    font-family: var(--display);
    font-size: 22px;
    padding-top: 2px;
  }
  .grid button.sel { background: var(--ink); color: var(--card); }
  .grid button.off {
    color: var(--muted);
    border-style: dashed;
    border-color: var(--muted);
    background: repeating-linear-gradient(135deg, transparent 0 6px, var(--spent) 6px 8px);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
  }

  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper output {
    min-width: 70px;
    text-align: center;
    font-family: var(--mono);
    font-weight: 800;
    font-size: 24px;
    font-variant-numeric: tabular-nums;
  }

  .switch { position: relative; width: 58px; height: 34px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; z-index: 1; }
  .switch span {
    position: absolute; inset: 0; border: 3px solid var(--ink); border-radius: 4px; background: var(--paper);
  }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 2px;
    background: var(--ink); transition: transform 0.15s;
  }
  .switch input:checked + span { background: var(--yellow); }
  .switch input:checked + span::after { transform: translateX(24px); }

  /* ---------- Paused dialog ---------- */
  #dialog {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(21, 20, 18, 0.55);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  #dialog[hidden] { display: none; }
  .d-box {
    width: min(100%, 380px);
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 8px;
    box-shadow: 10px 10px 0 var(--ink);
    padding: 22px 22px 26px;
  }
  .d-box h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 44px;
    text-transform: uppercase;
    line-height: 1;
  }
  .d-box p {
    margin: 8px 0 18px;
    font-family: var(--mono);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .d-box .btn { display: block; width: calc(100% - 5px); height: 70px; margin-top: 14px; }
</style>
</head>
<body>

<main id="app">
  <div id="dialWrap">
    <svg id="dial" viewBox="0 0 200 200" aria-hidden="true"></svg>
    <div id="readout">
      <div id="time"><span id="secs">30</span><span id="cents">.00</span></div>
      <div id="unit">SEC</div>
    </div>
  </div>

  <div id="topicArea">
    <div id="label"></div>
    <div id="topic" class="idle">Ready?</div>
    <div id="sub"></div>
  </div>

  <div id="bar">
    <button id="startBtn" class="btn btn-start">Start</button>
    <button id="skipBtn" class="btn btn-skip" hidden>Skip</button>
    <button id="correctBtn" class="btn btn-correct" hidden>Correct</button>
    <button id="newBtn" class="btn btn-ink" hidden>New round</button>
  </div>

  <div id="letterRow"><div id="letter">A</div></div>
</main>

<div id="holdRing" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <circle class="track" cx="50" cy="50" r="42" fill="none" stroke-width="12"/>
    <circle class="bar" id="holdBar" cx="50" cy="50" r="42" fill="none" stroke-width="12"/>
  </svg>
</div>
<div id="flash"></div>

<section id="settings" hidden>
  <div class="s-head">
    <h1>Settings</h1>
    <button id="closeSettings" class="chip ink">Close</button>
  </div>

  <div class="s-sec">
    <h2><span>Topics</span><span id="topicCount"></span></h2>
    <ol id="topicList"></ol>
    <div class="add-row">
      <input id="newTopic" type="text" placeholder="Add a topic" enterkeyhint="done" autocomplete="off" autocapitalize="sentences">
      <button id="addTopic" class="chip yellow">Add</button>
    </div>
    <div class="s-row" style="margin-top:14px">
      <span></span>
      <button id="resetTopics" class="chip danger">Reset topics</button>
    </div>
  </div>

  <div class="s-sec">
    <div class="s-row">
      <span>Shuffle topic order each round</span>
      <label class="switch"><input type="checkbox" id="shuffleToggle"><span></span></label>
    </div>
  </div>

  <div class="s-sec">
    <h2><span>Letter</span></h2>
    <div class="seg" id="letterMode">
      <button data-mode="random">Random</button>
      <button data-mode="manual">Pick one</button>
    </div>
    <div id="manualBlock">
      <div class="grid" id="manualGrid"></div>
      <p class="s-note">This letter stays until you switch back to Random.</p>
    </div>
    <div id="randomBlock">
      <div class="grid" id="excludeGrid"></div>
      <p class="s-note">Tap a letter to include or exclude it. Crossed-out letters are never dealt.</p>
    </div>
  </div>

  <div class="s-sec">
    <div class="s-row">
      <span>Timer length</span>
      <div class="stepper">
        <button class="icon-btn" id="timeDown" aria-label="Less time">−</button>
        <output id="timeVal">30s</output>
        <button class="icon-btn" id="timeUp" aria-label="More time">+</button>
      </div>
    </div>
  </div>

  <div class="s-sec">
    <div class="s-row">
      <span>Sound</span>
      <label class="switch"><input type="checkbox" id="soundToggle"><span></span></label>
    </div>
  </div>
</section>

<div id="dialog" hidden>
  <div class="d-box">
    <h2>Paused</h2>
    <p id="dialogInfo"></p>
    <button id="resumeBtn" class="btn btn-correct">Resume</button>
    <button id="restartBtn" class="btn btn-skip">New round</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Settings & storage ----------
  const DEFAULT_TOPICS = [
    'Animal', 'Food', 'Body part', 'Mythical creature', 'Country',
    'Name', 'Job', 'Sport', 'Something in a kitchen', 'Brand'
  ];
  const DEFAULTS = {
    topics: DEFAULT_TOPICS.slice(),
    letterMode: 'random',
    manualLetter: 'E',
    excludedLetters: ['Q', 'U', 'V', 'X', 'Y', 'Z'],
    timerSeconds: 30,
    shuffleTopics: true,
    sound: true
  };
  const KEY = 'alphabucks.settings.v1';
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const HOLD_MS = 3000;
  const END_LOCK_MS = 900; // stops a frantic tap jumping straight into the next round
  const TICKS = 60;

  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

  function loadSettings() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
    const s = Object.assign({}, DEFAULTS, saved);
    if (!Array.isArray(s.topics)) s.topics = DEFAULT_TOPICS.slice();
    s.topics = s.topics.filter(t => typeof t === 'string');
    if (!Array.isArray(s.excludedLetters)) s.excludedLetters = DEFAULTS.excludedLetters.slice();
    if (!LETTERS.includes(s.manualLetter)) s.manualLetter = 'E';
    if (s.letterMode !== 'manual') s.letterMode = 'random';
    s.timerSeconds = clamp(parseInt(s.timerSeconds, 10) || 30, 5, 600);
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  let S = loadSettings();

  // ---------- Round state (not saved) ----------
  const G = {
    state: 'ready',    // ready | running | paused | won | timeup
    letter: '',
    queue: [],
    count: 0,          // topics dealt this round
    endTime: 0,        // Date.now() at which the round ends (while running)
    remaining: 0,      // ms left (while ready/paused/ended)
    total: 0           // ms the round started with
  };

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const el = {
    dialWrap: $('dialWrap'), dial: $('dial'), secs: $('secs'), cents: $('cents'),
    topicArea: $('topicArea'), label: $('label'), topic: $('topic'), sub: $('sub'),
    start: $('startBtn'), skip: $('skipBtn'), correct: $('correctBtn'), newRound: $('newBtn'),
    letter: $('letter'), holdRing: $('holdRing'), holdBar: $('holdBar'), flash: $('flash'),
    settings: $('settings'), dialog: $('dialog'), dialogInfo: $('dialogInfo')
  };
  const HOLD_C = 2 * Math.PI * 42;
  el.holdBar.style.strokeDasharray = HOLD_C;

  // Stopwatch dial: 60 tick marks that go out one by one as time drains.
  const ticks = [];
  for (let i = 0; i < TICKS; i++) {
    const a = (i / TICKS) * Math.PI * 2 - Math.PI / 2;
    const major = i % 5 === 0;
    const r1 = major ? 78 : 84, r2 = 97;
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', (100 + r1 * Math.cos(a)).toFixed(2));
    ln.setAttribute('y1', (100 + r1 * Math.sin(a)).toFixed(2));
    ln.setAttribute('x2', (100 + r2 * Math.cos(a)).toFixed(2));
    ln.setAttribute('y2', (100 + r2 * Math.sin(a)).toFixed(2));
    if (major) ln.classList.add('major');
    el.dial.appendChild(ln);
    ticks.push(ln);
  }

  // ---------- Helpers ----------
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function cleanTopics() {
    return S.topics.map(t => t.trim()).filter(Boolean);
  }
  function letterPool() {
    const pool = LETTERS.filter(l => !S.excludedLetters.includes(l));
    return pool.length ? pool : LETTERS;
  }
  function letterIsValid(l) {
    return S.letterMode === 'manual' ? l === S.manualLetter : letterPool().includes(l);
  }
  function pickLetter() {
    if (S.letterMode === 'manual') return S.manualLetter;
    const pool = letterPool();
    const options = pool.length > 1 ? pool.filter(l => l !== G.letter) : pool;
    return options[Math.floor(Math.random() * options.length)];
  }
  function buildQueue() {
    const t = cleanTopics();
    return S.shuffleTopics ? shuffle(t) : t;
  }
  function msLeft() {
    return G.state === 'running' ? Math.max(0, G.endTime - Date.now()) : G.remaining;
  }
  // 8423 ms -> ["8", ".42"]; rounds down so it never shows time you don't have.
  function splitTime(ms) {
    const cs = Math.floor(Math.max(0, ms) / 10);
    return [String(Math.floor(cs / 100)), '.' + String(cs % 100).padStart(2, '0')];
  }
  const pad2 = n => String(n).padStart(2, '0');

  // ---------- Game flow ----------
  function setLetter(l) {
    const changed = l !== el.letter.textContent;
    G.letter = l;
    el.letter.textContent = l;
    if (changed) {
      el.letter.style.setProperty('--tilt', (Math.random() * 10 - 5).toFixed(1) + 'deg');
      el.letter.classList.remove('deal');
      void el.letter.offsetWidth;
      el.letter.classList.add('deal');
    }
  }

  function deal() {
    setLetter(pickLetter());
    G.queue = buildQueue();
    G.count = G.queue.length;
    G.total = G.remaining = S.timerSeconds * 1000;
    G.state = 'ready';
    render();
  }

  function start() {
    if (G.state !== 'ready' || !G.queue.length) return;
    unlockAudio();
    G.count = G.queue.length;
    G.total = G.remaining = S.timerSeconds * 1000;
    G.endTime = Date.now() + G.remaining;
    G.state = 'running';
    keepAwake(true);
    render(true);
    loop();
  }

  function correct() {
    if (G.state !== 'running') return;
    if (tickCheck()) return;
    G.queue.shift();
    if (!G.queue.length) {
      G.remaining = Math.max(0, G.endTime - Date.now());
      G.state = 'won';
      endRound();
    }
    render(true);
  }

  function skip() {
    if (G.state !== 'running') return;
    if (tickCheck()) return;
    if (G.queue.length > 1) G.queue.push(G.queue.shift());
    render(true);
  }

  function timeUp() {
    G.remaining = 0;
    G.state = 'timeup';
    endRound();
    playAlarm();
    el.flash.classList.remove('go');
    void el.flash.offsetWidth; // restart the animation
    el.flash.classList.add('go');
    render();
  }

  function endRound() {
    keepAwake(false);
    el.newRound.disabled = true;
    setTimeout(() => { el.newRound.disabled = false; }, END_LOCK_MS);
  }

  function pause(remainingMs) {
    if (G.state !== 'running') return;
    G.remaining = Math.max(0, remainingMs);
    G.state = 'paused';
    keepAwake(false);
    render();
  }

  function resume() {
    if (G.state !== 'paused') return;
    G.endTime = Date.now() + G.remaining;
    G.state = 'running';
    keepAwake(true);
    render();
    loop();
  }

  // Returns true if the round just ended because time ran out.
  function tickCheck() {
    if (G.state === 'running' && Date.now() >= G.endTime) { timeUp(); return true; }
    return false;
  }

  let rafId = 0;
  function loop() {
    cancelAnimationFrame(rafId);
    const step = () => {
      if (G.state !== 'running') return;
      if (tickCheck()) return;
      drawTimer();
      rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
  }

  // ---------- Rendering ----------
  let litTicks = -1, lastSec = '';
  function drawTimer() {
    const left = msLeft();
    const [s, c] = splitTime(left);
    if (el.secs.textContent !== s) el.secs.textContent = s;
    if (el.cents.textContent !== c) el.cents.textContent = c;

    const lit = G.total ? Math.ceil(clamp(left / G.total, 0, 1) * TICKS) : TICKS;
    if (lit !== litTicks) {
      for (let i = 0; i < TICKS; i++) ticks[i].classList.toggle('on', i < lit);
      litTicks = lit;
    }

    const low = G.state === 'running' && left <= 5000;
    el.dialWrap.classList.toggle('low', low);
    // A little thump on each second of the last five.
    if (low && s !== lastSec) {
      el.dialWrap.classList.remove('tick');
      void el.dialWrap.offsetWidth;
      el.dialWrap.classList.add('tick');
    }
    lastSec = s;
  }

  function render(newTopic) {
    const st = G.state;
    drawTimer();
    document.body.classList.toggle('timeup', st === 'timeup');

    const left = G.queue.length;
    const prevTopic = el.topic.textContent;
    el.topic.classList.toggle('idle', st === 'ready');
    if (st === 'ready') {
      el.label.textContent = left ? left + ' topics · letter ' + G.letter : '';
      el.topic.textContent = left ? 'Ready?' : 'No topics';
      el.sub.textContent = left ? '' : 'Hold here to add some';
    } else if (st === 'running' || st === 'paused') {
      el.label.textContent = 'Topic ' + pad2(G.count - left + 1) + ' / ' + pad2(G.count);
      el.topic.textContent = G.queue[0];
      el.sub.textContent = '';
    } else if (st === 'won') {
      el.label.textContent = 'All ' + G.count + ' cleared';
      el.topic.textContent = 'Done!';
      el.sub.textContent = splitTime(G.remaining).join('') + 's left';
    } else if (st === 'timeup') {
      el.label.textContent = (G.count - left) + ' / ' + G.count + ' done';
      el.topic.textContent = "Time's up";
      el.sub.textContent = left + ' left';
    }
    if (newTopic && el.topic.textContent !== prevTopic) {
      el.topic.classList.remove('pop');
      void el.topic.offsetWidth;
      el.topic.classList.add('pop');
    }

    el.start.hidden = st !== 'ready';
    el.start.disabled = !left;
    el.skip.hidden = el.correct.hidden = !(st === 'running' || st === 'paused');
    el.newRound.hidden = !(st === 'won' || st === 'timeup');
  }

  el.start.addEventListener('click', start);
  el.correct.addEventListener('click', correct);
  el.skip.addEventListener('click', skip);
  el.newRound.addEventListener('click', () => { if (!el.newRound.disabled) deal(); });

  // ---------- Sound (Web Audio; iOS needs a tap first) ----------
  let actx = null;
  function unlockAudio() {
    if (!S.sound) return;
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume();
      // Play a silent buffer inside the tap so iOS unlocks output.
      const buf = actx.createBuffer(1, 1, 22050);
      const src = actx.createBufferSource();
      src.buffer = buf;
      src.connect(actx.destination);
      src.start(0);
    } catch (e) {}
  }
  function tone(freq, at, dur, vol) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
    g.gain.setValueAtTime(vol, at + dur - 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g).connect(actx.destination);
    o.start(at);
    o.stop(at + dur + 0.02);
  }
  function playAlarm() {
    if (!S.sound || !actx) return;
    try {
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + 0.02;
      for (let i = 0; i < 3; i++) tone(880, t + i * 0.22, 0.16, 0.22);
      tone(587, t + 0.7, 0.6, 0.25);
    } catch (e) {}
  }

  // ---------- Keep the screen awake ----------
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on) {
        if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
          // The round may have ended while we waited for the lock.
          if (G.state !== 'running') keepAwake(false);
        }
      } else if (wakeLock) {
        const w = wakeLock; wakeLock = null;
        await w.release();
      }
    } catch (e) { wakeLock = null; }
  }

  // Locking the phone or switching apps: the end time is wall-clock based,
  // so on return we just check it again.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (G.state === 'running') {
      if (!tickCheck()) { keepAwake(true); loop(); }
    }
  });

  // ---------- Hold topic area for 3s to open settings ----------
  const hold = { id: null, start: 0, x: 0, y: 0, raf: 0, roundLeft: null };

  function holdCancel() {
    if (hold.id === null) return;
    hold.id = null;
    cancelAnimationFrame(hold.raf);
    el.holdRing.classList.remove('on');
  }
  el.topicArea.addEventListener('pointerdown', e => {
    if (hold.id !== null || !el.settings.hidden || !el.dialog.hidden) return;
    hold.id = e.pointerId;
    hold.start = Date.now();
    hold.x = e.clientX; hold.y = e.clientY;
    // Remember the clock now, so the 3s hold itself doesn't eat into the round.
    hold.roundLeft = G.state === 'running' ? G.endTime - hold.start : null;
    try { el.topicArea.setPointerCapture(e.pointerId); } catch (err) {}
    el.holdRing.style.left = e.clientX + 'px';
    el.holdRing.style.top = e.clientY + 'px';
    el.holdBar.style.strokeDashoffset = HOLD_C;
    el.holdRing.classList.add('on');
    const step = () => {
      if (hold.id === null) return;
      const p = (Date.now() - hold.start) / HOLD_MS;
      el.holdBar.style.strokeDashoffset = HOLD_C * (1 - clamp(p, 0, 1));
      if (p >= 1) {
        const left = hold.roundLeft;
        holdCancel();
        openSettings(left);
        return;
      }
      hold.raf = requestAnimationFrame(step);
    };
    hold.raf = requestAnimationFrame(step);
  });
  el.topicArea.addEventListener('pointermove', e => {
    if (e.pointerId !== hold.id) return;
    if (Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 40) holdCancel();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t =>
    el.topicArea.addEventListener(t, e => { if (e.pointerId === hold.id) holdCancel(); })
  );
  // Stop iOS's loupe, callout and text selection during the long press.
  el.topicArea.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  el.topicArea.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  // ---------- Settings panel ----------
  const topicList = $('topicList');
  const newTopic = $('newTopic');

  function openSettings(roundLeft) {
    if (G.state === 'running') pause(roundLeft != null ? roundLeft : G.endTime - Date.now());
    renderSettings();
    el.settings.hidden = false;
    el.settings.scrollTop = 0;
  }

  function closeSettings() {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    S.topics = S.topics.map(t => t.trim()).filter(Boolean);
    save();
    el.settings.hidden = true;
    if (G.state === 'paused') {
      const n = G.queue.length;
      el.dialogInfo.textContent = splitTime(G.remaining).join('') + 's · ' + n + (n === 1 ? ' topic' : ' topics') + ' left';
      el.dialog.hidden = false;
    } else if (G.state === 'ready') {
      // Pick up any changes to topics, letters or timer length.
      if (!letterIsValid(G.letter)) setLetter(pickLetter());
      G.queue = buildQueue();
      G.count = G.queue.length;
      G.total = G.remaining = S.timerSeconds * 1000;
      litTicks = -1;
      render();
    } else {
      render();
    }
  }

  function renderTopics() {
    topicList.innerHTML = '';
    S.topics.forEach((t, i) => {
      const li = document.createElement('li');
      const input = document.createElement('input');
      input.type = 'text';
      input.value = t;
      input.autocomplete = 'off';
      input.setAttribute('enterkeyhint', 'done');
      input.addEventListener('input', () => { S.topics[i] = input.value; save(); updateCount(); });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
      const up = iconBtn('↑', 'Move up', i === 0, () => move(i, -1));
      const down = iconBtn('↓', 'Move down', i === S.topics.length - 1, () => move(i, 1));
      const del = iconBtn('✕', 'Delete', false, () => { S.topics.splice(i, 1); save(); renderTopics(); });
      del.classList.add('del');
      li.append(input, up, down, del);
      topicList.appendChild(li);
    });
    updateCount();
  }
  function iconBtn(text, label, disabled, fn) {
    const b = document.createElement('button');
    b.className = 'icon-btn';
    b.textContent = text;
    b.setAttribute('aria-label', label);
    b.disabled = disabled;
    b.addEventListener('click', fn);
    return b;
  }
  function move(i, d) {
    const j = i + d;
    if (j < 0 || j >= S.topics.length) return;
    [S.topics[i], S.topics[j]] = [S.topics[j], S.topics[i]];
    save();
    renderTopics();
  }
  function updateCount() {
    const n = cleanTopics().length;
    $('topicCount').textContent = n + (n === 1 ? ' topic' : ' topics');
  }
  function addTopic() {
    const v = newTopic.value.trim();
    if (!v) return;
    S.topics.push(v);
    newTopic.value = '';
    save();
    renderTopics();
    newTopic.focus();
  }
  $('addTopic').addEventListener('click', addTopic);
  newTopic.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTopic(); } });
  $('resetTopics').addEventListener('click', () => {
    if (!confirm('Restore the 10 default topics? Your current list will be replaced.')) return;
    S.topics = DEFAULT_TOPICS.slice();
    save();
    renderTopics();
  });

  const shuffleToggle = $('shuffleToggle');
  shuffleToggle.addEventListener('change', () => { S.shuffleTopics = shuffleToggle.checked; save(); });
  const soundToggle = $('soundToggle');
  soundToggle.addEventListener('change', () => { S.sound = soundToggle.checked; save(); });

  $('letterMode').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (!b) return;
    S.letterMode = b.dataset.mode;
    save();
    renderLetters();
  });

  function renderLetters() {
    document.querySelectorAll('#letterMode button').forEach(b =>
      b.classList.toggle('on', b.dataset.mode === S.letterMode));
    $('manualBlock').hidden = S.letterMode !== 'manual';
    $('randomBlock').hidden = S.letterMode !== 'random';

    const mg = $('manualGrid'), xg = $('excludeGrid');
    mg.innerHTML = ''; xg.innerHTML = '';
    LETTERS.forEach(l => {
      const m = document.createElement('button');
      m.textContent = l;
      m.classList.toggle('sel', l === S.manualLetter);
      m.addEventListener('click', () => { S.manualLetter = l; save(); renderLetters(); });
      mg.appendChild(m);

      const x = document.createElement('button');
      x.textContent = l;
      const off = S.excludedLetters.includes(l);
      x.classList.toggle('off', off);
      x.setAttribute('aria-pressed', String(!off));
      x.addEventListener('click', () => {
        if (S.excludedLetters.includes(l)) {
          S.excludedLetters = S.excludedLetters.filter(v => v !== l);
        } else if (S.excludedLetters.length < LETTERS.length - 1) {
          S.excludedLetters = S.excludedLetters.concat(l).sort();
        } else {
          return; // keep at least one letter in play
        }
        save();
        renderLetters();
      });
      xg.appendChild(x);
    });
  }

  function renderTime() { $('timeVal').textContent = S.timerSeconds + 's'; }
  function stepTime(d) {
    S.timerSeconds = clamp(S.timerSeconds + d, 5, 600);
    save();
    renderTime();
  }
  $('timeDown').addEventListener('click', () => stepTime(-5));
  $('timeUp').addEventListener('click', () => stepTime(5));

  function renderSettings() {
    renderTopics();
    renderLetters();
    renderTime();
    shuffleToggle.checked = S.shuffleTopics;
    soundToggle.checked = S.sound;
  }
  $('closeSettings').addEventListener('click', closeSettings);

  // ---------- Paused dialog ----------
  $('resumeBtn').addEventListener('click', () => {
    el.dialog.hidden = true;
    unlockAudio();
    resume();
  });
  $('restartBtn').addEventListener('click', () => {
    el.dialog.hidden = true;
    deal();
  });

  // ---------- Boot ----------
  deal();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
